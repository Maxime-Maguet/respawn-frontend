<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo_Respawn.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="MobileOptimized" content="width" />
  <script>
    (function () {
      var meta = document.querySelector('meta[name="viewport"]');
      if (!meta) return;
      var shortSide = Math.min(screen.width || 0, screen.height || 0);
      var innerW = window.innerWidth || 0;
      var isPortrait = window.innerHeight >= window.innerWidth;
      var isTouch =
        window.matchMedia("(pointer: coarse)").matches ||
        window.matchMedia("(any-pointer: coarse)").matches;
      if (
        isTouch &&
        isPortrait &&
        shortSide > 0 &&
        shortSide < 768 &&
        innerW > shortSide * 1.3
      ) {
        meta.setAttribute(
          "content",
          "width=" + shortSide + ", initial-scale=1.0, viewport-fit=cover",
        );
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <title>Respawn</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
